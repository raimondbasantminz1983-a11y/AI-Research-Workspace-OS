<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RBM Workspace OS</title>

<style>

:root{
--bg:#f4f4f4;
--panel:#ffffff;
--text:#111111;
--border:#d8d8d8;
--active:#1f6fff;
--shadow:rgba(0,0,0,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
font-family:system-ui;
height:100vh;
overflow:hidden;
color:var(--text);
}

/* TOP BAR */

.topbar{
height:64px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
}

.left-top{
display:flex;
align-items:center;
gap:10px;
}

.logo{
font-size:18px;
font-weight:700;
}

.search{
width:220px;
padding:10px;
border-radius:12px;
border:1px solid var(--border);
outline:none;
background:#fafafa;
}

.right-top{
display:flex;
align-items:center;
gap:10px;
}

.icon-btn{
padding:10px 14px;
border:none;
border-radius:12px;
background:#111;
color:white;
cursor:pointer;
}

.match{
padding:10px 14px;
background:#f1f1f1;
border-radius:12px;
font-weight:600;
}

/* MAIN */

.main{
display:flex;
height:calc(100vh - 64px);
}

/* SIDEBAR */

.sidebar{
width:240px;
background:white;
border-right:1px solid var(--border);
padding:12px;
overflow:auto;
}

.menu-title{
font-size:14px;
font-weight:700;
margin-bottom:12px;
opacity:.7;
}

.side-btn{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:16px;
background:#f4f4f4;
cursor:pointer;
text-align:left;
font-size:15px;
}

/* CENTER */

.center{
flex:1;
display:flex;
flex-direction:column;
}

/* WORKSPACE TABS */

.workspace-tabs{
height:72px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
gap:12px;
padding:0 15px;
overflow:auto;
}

.workspace{
min-width:170px;
height:50px;
border-radius:18px;
border:2px solid transparent;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
background:#f5f5f5;
cursor:pointer;
transition:.2s;
font-weight:700;
}

.workspace.active{
border-color:var(--active);
box-shadow:0 0 14px rgba(31,111,255,.25);
}

.color-box{
width:18px;
height:18px;
border-radius:50%;
}

/* MAIN WORKSPACE */

.main-workspace{
flex:1;
padding:20px;
overflow:auto;
background:#fafafa;
}

.workspace-view{
background:white;
min-height:100%;
border-radius:24px;
border:1px solid var(--border);
padding:20px;
box-shadow:0 4px 20px var(--shadow);
}

.workspace-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.workspace-title h2{
font-size:24px;
}

/* NOTES */

.note{
background:#ffffff;
border:1px solid var(--border);
border-radius:18px;
padding:16px;
margin-bottom:15px;
line-height:1.7;
}

.note-buttons{
margin-top:14px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.note-buttons button{
padding:8px 12px;
border:none;
border-radius:10px;
background:black;
color:white;
cursor:pointer;
}

/* VIEWER */

.viewer{
position:fixed;
right:20px;
top:90px;
width:300px;
height:240px;
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:15px;
overflow:auto;
box-shadow:0 4px 20px var(--shadow);
}

/* BOTTOM BAR */

.bottom-bar{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
padding:12px;
background:white;
border-radius:20px;
border:1px solid var(--border);
box-shadow:0 4px 18px var(--shadow);
z-index:999;
}

.bottom-bar button{
padding:12px 15px;
border:none;
border-radius:12px;
background:black;
color:white;
cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

.main{
flex-direction:column;
}

.sidebar{
width:100%;
height:120px;
border-right:none;
border-bottom:1px solid var(--border);
display:flex;
gap:10px;
overflow:auto;
}

.side-btn{
min-width:160px;
height:60px;
margin-bottom:0;
}

.viewer{
display:none;
}

.search{
width:120px;
}

}

</style>
</head>
<body>

<!-- TOP -->

<div class="topbar">

<div class="left-top">

<div class="logo">
RBM Workspace OS
</div>

<input
class="search"
placeholder="Search..."
oninput="searchItems(this.value)"
>

</div>

<div class="right-top">

<button class="icon-btn" onclick="undoAction()">
↶
</button>

<button class="icon-btn" onclick="redoAction()">
↷
</button>

<div class="match" id="matchBox">
Match 0%
</div>

<button class="icon-btn" onclick="toggleTheme()">
Theme
</button>

<button class="icon-btn" onclick="toggleMenu()">
⋮
</button>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="menu-title">
SYSTEM
</div>

<button class="side-btn">
Search
</button>

<button class="side-btn">
Settings
</button>

<button class="side-btn">
Backup
</button>

<button class="side-btn">
Theme
</button>

<button class="side-btn">
Help
</button>

<button class="side-btn">
Recovery
</button>

</div>

<!-- CENTER -->

<div class="center">

<!-- WORKSPACE SWITCH -->

<div class="workspace-tabs" id="workspaceTabs">

</div>

<!-- ACTIVE WORKSPACE -->

<div class="main-workspace">

<div class="workspace-view">

<div class="workspace-title">

<h2 id="workspaceName">
Workspace A
</h2>

<button class="icon-btn" onclick="renameWorkspace()">
Rename
</button>

</div>

<div id="workspaceContent">

</div>

</div>

</div>

</div>

</div>

<!-- VIEWER -->

<div class="viewer">

<h3>Viewer</h3>

<br>

<div id="viewerContent">
Ready...
</div>

</div>

<!-- BOTTOM -->

<div class="bottom-bar">

<button onclick="addNote()">
Add
</button>

<button>
Photo
</button>

<button>
Video
</button>

<button>
Voice
</button>

<button>
🎤
</button>

<button>
🔊
</button>

<button onclick="exportData()">
Export
</button>

<button onclick="importData()">
Import
</button>

</div>

<script>

let currentWorkspace = 'A';

let dark = false;

let historyStack = [];
let redoStack = [];

let workspaceNames = {
A:'Workspace A',
B:'Workspace B',
C:'Workspace C'
};

let workspaceColors = {
A:'#2f7cff',
B:'#00aa55',
C:'#cc3333'
};

let workspaceFiles = {
A:[],
B:[],
C:[]
};

/* SAVE */

function saveData(){

localStorage.setItem(
'RBM_WORKSPACE_OS',
JSON.stringify({
workspaceFiles,
workspaceNames,
workspaceColors
})
);

}

/* RESTORE */

function restoreData(){

const saved =
localStorage.getItem(
'RBM_WORKSPACE_OS'
);

if(saved){

const data =
JSON.parse(saved);

workspaceFiles =
data.workspaceFiles;

workspaceNames =
data.workspaceNames;

workspaceColors =
data.workspaceColors;

}

}

/* RENDER TABS */

function renderTabs(){

const tabs =
document.getElementById(
'workspaceTabs'
);

tabs.innerHTML='';

['A','B','C'].forEach(key=>{

const div =
document.createElement('div');

div.className =
'workspace ' +
(currentWorkspace===key
?'active':'');

div.ondblclick=()=>renameKey(key);

div.onclick=()=>switchWorkspace(key);

div.innerHTML=`

<span>
${workspaceNames[key]}
</span>

<div
class="color-box"
style="
background:
${workspaceColors[key]}
"
></div>

`;

tabs.appendChild(div);

});

}

/* SWITCH */

function switchWorkspace(key){

currentWorkspace = key;

renderTabs();

renderWorkspace();

updateMatch();

}

/* RENDER WORKSPACE */

function renderWorkspace(){

document.getElementById(
'workspaceName'
).innerText =
workspaceNames[currentWorkspace];

const area =
document.getElementById(
'workspaceContent'
);

area.innerHTML='';

workspaceFiles[currentWorkspace]
.forEach((item,index)=>{

const div =
document.createElement('div');

div.className='note';

div.innerHTML=`

<h3>${item.title}</h3>

<br>

<div>${item.text}</div>

<div class="note-buttons">

<button
onclick="
openItem(${index})
">
Open
</button>

<button
onclick="
deleteItem(${index})
">
Delete
</button>

</div>

`;

area.appendChild(div);

});

}

/* ADD */

function addNote(){

const text =
prompt('Enter Note');

if(!text) return;

historyStack.push(
JSON.stringify(workspaceFiles)
);

workspaceFiles[currentWorkspace]
.push({
title:'Note',
text,
time:Date.now()
});

saveData();

renderWorkspace();

updateMatch();

}

/* OPEN */

function openItem(index){

const item =
workspaceFiles[currentWorkspace][index];

document.getElementById(
'viewerContent'
).innerHTML=`

<h2>${item.title}</h2>

<br>

${item.text}

`;

}

/* DELETE */

function deleteItem(index){

historyStack.push(
JSON.stringify(workspaceFiles)
);

workspaceFiles[currentWorkspace]
.splice(index,1);

saveData();

renderWorkspace();

updateMatch();

}

/* RENAME */

function renameWorkspace(){

const name =
prompt(
'Rename Workspace'
);

if(!name) return;

workspaceNames[currentWorkspace]
= name;

saveData();

renderTabs();

renderWorkspace();

}

function renameKey(key){

const name =
prompt(
'New Workspace Name'
);

if(!name) return;

workspaceNames[key]
= name;

saveData();

renderTabs();

renderWorkspace();

}

/* SEARCH */

function searchItems(q){

q=q.toLowerCase();

const notes =
document.querySelectorAll('.note');

notes.forEach(note=>{

if(
note.innerText
.toLowerCase()
.includes(q)
){

note.style.display='block';

}else{

note.style.display='none';

}

});

}

/* THEME */

function toggleTheme(){

dark=!dark;

if(dark){

document.documentElement
.style.setProperty(
'--bg',
'#0f0f0f'
);

document.documentElement
.style.setProperty(
'--panel',
'#181818'
);

document.documentElement
.style.setProperty(
'--text',
'#ffffff'
);

document.documentElement
.style.setProperty(
'--border',
'#333333'
);

document.body.style.color='white';

}else{

document.documentElement
.style.setProperty(
'--bg',
'#f4f4f4'
);

document.documentElement
.style.setProperty(
'--panel',
'#ffffff'
);

document.documentElement
.style.setProperty(
'--text',
'#111111'
);

document.documentElement
.style.setProperty(
'--border',
'#d8d8d8'
);

document.body.style.color='black';

}

}

/* MATCH */

function updateMatch(){

const a =
workspaceFiles.A.length;

const b =
workspaceFiles.B.length;

const c =
workspaceFiles.C.length;

const total =
a+b+c;

let percent = 0;

if(total>0){

percent =
Math.floor(
(
workspaceFiles[currentWorkspace]
.length
/
total
)*100
);

}

document.getElementById(
'matchBox'
).innerText =
'Match ' + percent + '%';

}

/* UNDO */

function undoAction(){

if(!historyStack.length)
return;

redoStack.push(
JSON.stringify(workspaceFiles)
);

workspaceFiles =
JSON.parse(
historyStack.pop()
);

saveData();

renderWorkspace();

}

/* REDO */

function redoAction(){

if(!redoStack.length)
return;

historyStack.push(
JSON.stringify(workspaceFiles)
);

workspaceFiles =
JSON.parse(
redoStack.pop()
);

saveData();

renderWorkspace();

}

/* EXPORT */

function exportData(){

const blob =
new Blob([

JSON.stringify(
workspaceFiles,
null,
2
)

],{

type:'application/json'

});

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download =
'RBM-Workspace.json';

a.click();

}

/* IMPORT */

function importData(){

const input =
document.createElement('input');

input.type='file';

input.onchange=e=>{

const file =
e.target.files[0];

const reader =
new FileReader();

reader.onload=()=>{

workspaceFiles =
JSON.parse(reader.result);

saveData();

renderWorkspace();

updateMatch();

};

reader.readAsText(file);

};

input.click();

}

/* MENU */

function toggleMenu(){

alert(
'Menu:\\n\\nNew\\nSave\\nSave As\\nRename\\nDelete\\nImport\\nExport\\nHistory\\nShare\\nClose'
);

}

restoreData();

renderTabs();

renderWorkspace();

updateMatch();

</script>

</body>
</html>
