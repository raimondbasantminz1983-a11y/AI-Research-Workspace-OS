<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RBM Workspace System</title>

<style>

:root{
--bg:#f3f3f3;
--panel:#ffffff;
--line:#d6d6d6;
--text:#111;
--active:#2f7cff;
--shadow:0 2px 10px rgba(0,0,0,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:var(--bg);
color:var(--text);
margin:0;
padding:0;
width:100%;
min-height:100vh;
overflow-x:hidden;
}

.app{
display:flex;
width:100%;
min-height:100vh;
overflow-x:hidden;
}

/* LEFT MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
padding:10px;
gap:10px;
min-width:0;
overflow:hidden;
}

/* TOP BAR */

.topbar{
height:72px;
background:var(--panel);
border-radius:18px;
box-shadow:var(--shadow);
display:flex;
align-items:center;
padding:10px;
gap:10px;
}

.logo{
font-size:20px;
font-weight:700;
width:180px;
}

.search{
flex:1;
height:45px;
border:none;
outline:none;
padding:0 15px;
border-radius:14px;
background:#ececec;
font-size:16px;
}

.iconBtn{
width:46px;
height:46px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:18px;
cursor:pointer;
}

.matchBox{
width:110px;
height:50px;
border-radius:14px;
background:#ececec;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-weight:700;
}

.themeBtn{
padding:0 18px;
height:46px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:15px;
cursor:pointer;
}

/* SETTINGS */

.settingBar{
height:95px;
display:flex;
gap:15px;
}

.settingCard{
flex:1;
background:var(--panel);
border-radius:20px;
box-shadow:var(--shadow);
padding:18px;
font-size:20px;
font-weight:600;
}

/* MAIN VIEW */

.viewer{
flex:1;
background:var(--panel);
border-radius:26px;
box-shadow:var(--shadow);
padding:20px;
overflow:auto;
position:relative;
width:100%;
max-width:100%;
}

.viewer h1{
font-size:38px;
margin-bottom:10px;
}

.workspaceText{
font-size:18px;
line-height:1.8;
}

/* RIGHT SIDE */

.side{
width:320px;
max-width:320px;
flex-shrink:0;
border-left:2px solid var(--line);
display:flex;
flex-direction:column;
padding:10px;
gap:10px;
}

/* A B C */

.tabs{
display:flex;
flex-direction:column;
gap:10px;
}

.tab{
height:78px;
background:var(--panel);
border-radius:18px;
box-shadow:var(--shadow);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
font-size:26px;
font-weight:700;
cursor:pointer;
border:3px solid transparent;
transition:.2s;
}

.tab.active{
border-color:var(--active);
box-shadow:0 0 12px rgba(47,124,255,.4);
}

.dot{
width:24px;
height:24px;
border-radius:50%;
}

.aDot{ background:#2f7cff; }
.bDot{ background:#00b84d; }
.cDot{ background:#ff9900; }

/* LOWER AREA */

.lower{
flex:1;
display:flex;
gap:10px;
}

/* ADS */

.ads{
width:120px;
background:var(--panel);
border-radius:20px;
box-shadow:var(--shadow);
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

.adBox{
height:90px;
border-radius:16px;
background:#ececec;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:700;
}

/* CONTROL PANEL */

.control{
flex:1;
background:var(--panel);
border-radius:20px;
box-shadow:var(--shadow);
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
overflow:auto;
}

.control button{
height:46px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:15px;
cursor:pointer;
}

/* BOTTOM BAR */

.bottom{
height:80px;
background:var(--panel);
border-top:2px solid var(--line);
display:flex;
align-items:center;
gap:10px;
padding:10px;
overflow:auto;
}

.bottom button{
min-width:110px;
height:52px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:15px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

.app{
flex-direction:column;
overflow:auto;
height:auto;
}

.side{
width:100%;
border-left:none;
border-top:2px solid var(--line);
}

.lower{
min-height:300px;
}

.viewer{
min-height:400px;
}

}
html,
body{
width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
margin:0;
padding:0;
}

/* FULL APP FIX */

.app{
width:100%;
min-height:100vh;
overflow-x:hidden;
}

/* MAIN AREA FIX */

.main{
min-width:0;
overflow:hidden;
}

/* VIEWER FIX */

.viewer{
width:100%;
max-width:100%;
overflow:auto;
}

/* RIGHT PANEL FIX */

.side{
flex-shrink:0;
max-width:320px;
}

/* MOBILE FIX */

@media(max-width:900px){

body{
overflow:auto;
}

.app{
width:100%;
max-width:100%;
overflow-x:hidden;
flex-direction:column;
}

.main{
width:100%;
padding:8px;
}

.side{
width:100%;
max-width:100%;
padding:8px;
border-left:none;
border-top:2px solid var(--line);
}

.topbar{
flex-wrap:wrap;
height:auto;
min-height:72px;
overflow:hidden;
}

.logo{
width:100%;
font-size:18px;
}

.search{
min-width:0;
width:100%;
}

.settingBar{
flex-direction:column;
height:auto;
}

.tabs{
width:100%;
}

.tab{
width:100%;
}

.lower{
flex-direction:column;
width:100%;
min-height:300px;
}

.ads{
width:100%;
flex-direction:row;
overflow:auto;
}

.control{
width:100%;
}

.viewer{
min-height:420px;
}

.bottom{
width:100%;
overflow-x:auto;
padding-bottom:14px;
scrollbar-width:none;
}

.bottom::-webkit-scrollbar{
display:none;
}

.bottom button{
flex-shrink:0;
}

}
</style>
</head>

<body>

<div class="app">

<!-- MAIN -->

<div class="main">

<!-- TOP -->

<div class="topbar">

<div class="logo">
RBM WORKSPACE
</div>

<input class="search" placeholder="search..." oninput="searchText(this.value)">

<button class="iconBtn" onclick="undoAction()">↶</button>

<button class="iconBtn" onclick="redoAction()">↷</button>

<div class="matchBox">
<div>match</div>
<div id="matchValue">0%</div>
</div>

<button class="themeBtn" onclick="toggleTheme()">
विषय
</button>

</div>

<!-- SETTINGS -->

<div class="settingBar">

<div class="settingCard">
खोज
</div>

<div class="settingCard">
सेटिंग्स
</div>

</div>

<!-- VIEWER -->

<div class="viewer">

<h1 id="workspaceTitle">Workspace A</h1>

<div class="workspaceText" id="viewerText">

यह मुख्य कार्यक्षेत्र है।  
यहाँ A / B / C का डेटा खुलेगा।

</div>

</div>

<!-- BOTTOM -->

<div class="bottom">

<button onclick="addText()">Add</button>

<button onclick="addPhoto()">Image</button>

<button onclick="addVideo()">Video</button>

<button onclick="voiceInput()">Voice</button>

<button onclick="copyText()">📋</button>

<button onclick="speakText()">🔊</button>

<button onclick="exportData()">Export</button>

<button onclick="translateText()">Language</button>

</div>

</div>

<!-- RIGHT -->

<div class="side">

<!-- A B C -->

<div class="tabs">

<div class="tab active" id="tabA" onclick="openWorkspace('A')">
<div>A</div>
<div class="dot aDot"></div>
</div>

<div class="tab" id="tabB" onclick="openWorkspace('B')">
<div>B</div>
<div class="dot bDot"></div>
</div>

<div class="tab" id="tabC" onclick="openWorkspace('C')">
<div>C</div>
<div class="dot cDot"></div>
</div>

</div>

<!-- LOWER -->

<div class="lower">

<!-- ADS -->

<div class="ads">

<div class="adBox">
AD
</div>

<div class="adBox">
MEDIA
</div>

<div class="adBox">
THUMB
</div>

</div>

<!-- CONTROL -->

<div class="control">

<button onclick="renameWorkspace()">
Rename
</button>

<button onclick="selectAllText()">
Select All
</button>

<button onclick="cutText()">
Cut
</button>

<button onclick="pasteText()">
Paste
</button>

<button onclick="saveBackup()">
Backup
</button>

<button onclick="helpSystem()">
Help
</button>

<button onclick="recoverySystem()">
Recovery
</button>

</div>

</div>

</div>

</div>

<script>

let currentWorkspace = 'A';

let data = {
A:'',
B:'',
C:''
};

function openWorkspace(name){

currentWorkspace = name;

document.querySelectorAll('.tab')
.forEach(tab=>tab.classList.remove('active'));

document
.getElementById('tab'+name)
.classList.add('active');

document.getElementById('workspaceTitle')
.innerText = 'Workspace' + name;

document.getElementById('viewerText')
.innerText = data[name] || 'Empty Workspace';

updateMatch();

}

function addText(){

let text = prompt('Add Text here');

if(!text) return;

data[currentWorkspace] += '\n' + text;

document.getElementById('viewerText')
.innerText = data[currentWorkspace];

updateMatch();

}

function renameWorkspace(){

let newName = prompt('New Name');

if(!newName) return;

document.querySelector(
'#tab'+currentWorkspace+' div:first-child'
).innerText = newName;

document.getElementById('workspaceTitle')
.innerText = newName;

}

function toggleTheme(){

const dark = document.body.dataset.dark;

if(dark){

document.body.dataset.dark = '';

document.documentElement.style
.setProperty('--bg','#f3f3f3');

document.documentElement.style
.setProperty('--panel','#ffffff');

document.documentElement.style
.setProperty('--text','#111');

}else{

document.body.dataset.dark = '1';

document.documentElement.style
.setProperty('--bg','#0f0f0f');

document.documentElement.style
.setProperty('--panel','#181818');

document.documentElement.style
.setProperty('--text','#fff');

}
}
function updateMatch(){

let a = data.A.length;
let b = data.B.length;

let percent = 0;

if(a && b){

percent = Math.floor(
(Math.min(a,b)/Math.max(a,b))*100
);

}

document.getElementById('matchValue')
.innerText = percent + '%';

}

function copyText(){

navigator.clipboard.writeText(
data[currentWorkspace]
);

alert('Copied');

}

function cutText(){

navigator.clipboard.writeText(
data[currentWorkspace]
);

data[currentWorkspace]='';

document.getElementById('viewerText')
.innerText='';

}

async function pasteText(){

let txt = await navigator.clipboard.readText();

data[currentWorkspace]+=txt;

document.getElementById('viewerText')
.innerText=data[currentWorkspace];

}

function selectAllText(){

alert('Select All Ready');

}

function searchText(value){

document.getElementById('viewerText')
.style.background =
value ? '#fff8c4' : 'transparent';

}

function exportData(){

const blob = new Blob(
[JSON.stringify(data)],
{type:'application/json'}
);

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = 'workspace.json';

a.click();

}

function translateText(){

alert('Translate System Ready');

}

function saveBackup(){

localStorage.setItem(
'RBM_WORKSPACE',
JSON.stringify(data)
);

alert('Backup Saved');

}

function recoverySystem(){

const saved = localStorage
.getItem('RBM_WORKSPACE');

if(saved){

data = JSON.parse(saved);

openWorkspace(currentWorkspace);

alert('Recovered');

}

}

function helpSystem(){

alert('RBM Workspace Help Ready');

}

function addPhoto(){

alert('Photo System Ready');

}

function addVideo(){

alert('Video System Ready');

}

function voiceInput(){

alert('Voice Input Ready');

}

function speakText(){

const speech = new SpeechSynthesisUtterance(
data[currentWorkspace]
);

speechSynthesis.speak(speech);

}

function undoAction(){

alert('Undo Ready');

}

function redoAction(){

alert('Redo Ready');

}

openWorkspace( 'A' );

</script>

</body>
</html>
