<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RBM Workspace System</title>

<style>

:root{
--bg:#f3f3f3;
--panel:#ffffff;
--line:#d6d6d6;
--text:#111;
--active:#2f7cff;
--shadow:0 2px 10px rgba(0,0,0,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:var(--bg);
height:100vh;
overflow:hidden;
color:var(--text);
}

.app{
display:flex;
height:100vh;
}

.main{
flex:1;
display:flex;
flex-direction:column;
padding:10px;
gap:10px;
}

.topbar{
height:72px;
background:var(--panel);
border-radius:18px;
box-shadow:var(--shadow);
display:flex;
align-items:center;
padding:10px;
gap:10px;
}

.logo{
font-size:20px;
font-weight:700;
width:180px;
}

.search{
flex:1;
height:45px;
border:none;
outline:none;
padding:0 15px;
border-radius:14px;
background:#ececec;
font-size:16px;
}

.iconBtn{
width:46px;
height:46px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:18px;
cursor:pointer;
}

.matchBox{
width:110px;
height:50px;
border-radius:14px;
background:#ececec;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-weight:700;
}

.themeBtn{
padding:0 18px;
height:46px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:15px;
cursor:pointer;
}

.settingBar{
height:95px;
display:flex;
gap:15px;
}

.settingCard{
flex:1;
background:var(--panel);
border-radius:20px;
box-shadow:var(--shadow);
padding:18px;
font-size:20px;
font-weight:600;
}

.viewer{
flex:1;
background:var(--panel);
border-radius:26px;
box-shadow:var(--shadow);
padding:20px;
overflow:auto;
position:relative;
width:100%;
max-width:100%;
scroll-behavior:smooth;
}

.workspaceText{
font-size:18px;
line-height:1.8;
overflow:auto;
white-space:pre-wrap;
word-break:break-word;
padding-bottom:20px;
}

.side{
width:320px;
border-left:2px solid var(--line);
display:flex;
flex-direction:column;
padding:10px;
gap:10px;
}

.tabs{
display:flex;
flex-direction:column;
gap:10px;
flex:1;
}

.tab{
flex:1;
min-height:180px;
background:var(--panel);
border-radius:22px;
box-shadow:var(--shadow);
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:flex-start;
padding:18px;
font-size:30px;
font-weight:700;
cursor:pointer;
border:3px solid transparent;
transition:.2s;
overflow:auto;
position:relative;
}

.tab.active{
border-color:var(--active);
box-shadow:0 0 12px rgba(47,124,255,.4);
}

.preview{
margin-top:12px;
font-size:14px;
font-weight:400;
width:100%;
white-space:pre-wrap;
scroll-behavior:smooth;
opacity:.8;
}

.dot{
width:24px;
height:24px;
border-radius:50%;
}

.aDot{ background:#2f7cff; }
.bDot{ background:#00b84d; }
.cDot{ background:#ff9900; }

.lower{
flex:1;
display:flex;
gap:10px;
}

.ads{
width:120px;
background:var(--panel);
border-radius:20px;
box-shadow:var(--shadow);
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

.adBox{
height:90px;
border-radius:16px;
background:#ececec;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:700;
}

.control{
flex:1;
background:var(--panel);
border-radius:20px;
box-shadow:var(--shadow);
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
overflow:auto;
}

.control button{
height:46px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:15px;
cursor:pointer;
}

.bottom{
height:80px;
background:var(--panel);
border-top:2px solid var(--line);
display:flex;
align-items:center;
gap:10px;
padding:10px;
overflow:auto;
}

.bottom button{
min-width:110px;
height:52px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:15px;
cursor:pointer;
}

@media(max-width:900px){

.app{
flex-direction:column;
overflow:auto;
height:auto;
}

.side{
width:100%;
border-left:none;
border-top:2px solid var(--line);
}

.lower{
min-height:300px;
}

.viewer{
min-height:400px;
}

}

</style>
</head>

<body>

<div class="app">

<div class="main">

<div class="topbar">

<div class="logo">
RBM WORKSPACE
</div>

<input class="search" placeholder="Search..." oninput="searchText(this.value)">

<button class="iconBtn" onclick="undoAction()">↶</button>

<button class="iconBtn" onclick="redoAction()">↷</button>

<div class="matchBox">
<div>Match</div>
<div id="matchValue">0%</div>
</div>

<button class="themeBtn" onclick="toggleTheme()">
Subject
</button>

</div>

<div class="settingBar">

<div class="settingCard">
Search
</div>

<div class="settingCard">
Setting
</div>

</div>

<div class="viewer">

<h1 id="workspaceTitle">Workspace A</h1>

<div class="workspaceText" id="viewerText">

यह मुख्य कार्यक्षेत्र है।
यहाँ A / B / C का डेटा खुलेगा।

</div>

</div>

<div class="bottom">

<button onclick="addText()">Add</button>

<button onclick="addPhoto()">Image</button>

<button onclick="addVideo()">Video</button>

<button onclick="voiceInput()">Voice</button>

<button onclick="copyText()">📋</button>

<button onclick="speakText()">🔊</button>

<button onclick="exportData()">Export</button>

<button onclick="translateText()">Language</button>

</div>

</div>

<div class="side">

<div class="tabs">

<div class="tab active" id="tabA" onclick="openWorkspace('A')">

<div style="display:flex;justify-content:space-between;width:100%;">
<div class="tabName">A</div>
<div class="dot aDot"></div>
</div>

<div class="preview" id="previewA"></div>

</div>

<div class="tab" id="tabB" onclick="openWorkspace('B')">

<div style="display:flex;justify-content:space-between;width:100%;">
<div class="tabName">B</div>
<div class="dot bDot"></div>
</div>

<div class="preview" id="previewB"></div>

</div>

<div class="tab" id="tabC" onclick="openWorkspace('C')">

<div style="display:flex;justify-content:space-between;width:100%;">
<div class="tabName">C</div>
<div class="dot cDot"></div>
</div>

<div class="preview" id="previewC"></div>

</div>

</div>

<div class="lower">

<div class="ads">

<div class="adBox">AD</div>
<div class="adBox">MEDIA</div>
<div class="adBox">THUMB</div>

</div>

<div class="control">

<button onclick="renameWorkspace()">Rename</button>

<button onclick="selectAllText()">Select All</button>

<button onclick="cutText()">Cut</button>

<button onclick="pasteText()">Paste</button>

<button onclick="saveBackup()">Backup</button>

<button onclick="helpSystem()">Help</button>

<button onclick="recoverySystem()">Recovery</button>

</div>

</div>

</div>

</div>

<script>

let currentWorkspace = 'A';

let data = {
A:'',
B:'',
C:''
};

let workspaceNames = {
A:'Workspace A',
B:'Workspace B',
C:'Workspace C'
};

function openWorkspace(name){

currentWorkspace = name;

document.querySelectorAll('.tab')
.forEach(tab => tab.classList.remove('active'));

document
.getElementById('tab'+name)
.classList.add('active');

document.getElementById('workspaceTitle')
.innerText = workspaceNames[name];

document.getElementById('viewerText')
.innerText = data[name] || 'Empty Workspace';

updateMatch();

}

function addText(){

let text = prompt('Text here');

if(!text) return;

data[currentWorkspace] += '\n' + text;

document.getElementById('viewerText')
.innerText = data[currentWorkspace];

updatePreview();

updateMatch();

}

function updatePreview(){

document.getElementById('previewA').innerText =
data.A || 'Empty';

document.getElementById('previewB').innerText =
data.B || 'Empty';

document.getElementById('previewC').innerText =
data.C || 'Empty';

}

function renameWorkspace(){

let newName = prompt('New Workspace Name');

if(!newName) return;

workspaceNames[currentWorkspace] = newName;

document.querySelector(
'#tab'+currentWorkspace+' .tabName'
).innerText = newName;

document.getElementById('workspaceTitle')
.innerText = newName;

}

function toggleTheme(){

const dark = document.body.dataset.dark;

if(dark){

document.body.dataset.dark = '';

document.documentElement.style
.setProperty('--bg','#f3f3f3');

document.documentElement.style
.setProperty('--panel','#ffffff');

document.documentElement.style
.setProperty('--text','#111');

}else{

document.body.dataset.dark = '1';

document.documentElement.style
.setProperty('--bg','#0f0f0f');

document.documentElement.style
.setProperty('--panel','#181818');

document.documentElement.style
.setProperty('--text','#fff');

}

}

function updateMatch(){

let a = data.A.length;
let b = data.B.length;

let percent = 0;

if(a && b){

percent = Math.floor(
(Math.min(a,b)/Math.max(a,b))*100
);

}

document.getElementById('matchValue')
.innerText = percent + '%';

}

function copyText(){

navigator.clipboard.writeText(
data[currentWorkspace]
);

alert('Copied');

}

function cutText(){

navigator.clipboard.writeText(
data[currentWorkspace]
);

data[currentWorkspace] = '';

document.getElementById('viewerText')
.innerText = '';

updatePreview();

updateMatch();

}

async function pasteText(){

let txt = await navigator.clipboard.readText();

data[currentWorkspace] += txt;

document.getElementById('viewerText')
.innerText = data[currentWorkspace];

updatePreview();

updateMatch();

}

function selectAllText(){

alert('Select All Ready');

}

function searchText(value){

document.getElementById('viewerText')
.style.background =
value ? '#fff8c4' : 'transparent';

}

function exportData(){

const blob = new Blob(
[JSON.stringify(data)],
{type:'application/json'}
);

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = 'workspace.json';

a.click();

}

function translateText(){

alert('Translate System Ready');

}

function saveBackup(){

localStorage.setItem(
'RBM_WORKSPACE',
JSON.stringify({
data,
workspaceNames
})
);

alert('Backup Saved');

}

function recoverySystem(){

const saved = localStorage
.getItem('RBM_WORKSPACE');

if(saved){

const parsed = JSON.parse(saved);

data = parsed.data || data;

workspaceNames =
parsed.workspaceNames || workspaceNames;

document.querySelector('#tabA .tabName')
.innerText = workspaceNames.A;

document.querySelector('#tabB .tabName')
.innerText = workspaceNames.B;

document.querySelector('#tabC .tabName')
.innerText = workspaceNames.C;

openWorkspace(currentWorkspace);

alert('Recovered');

}

}

function helpSystem(){

alert('RBM Workspace Help Ready');

}

function addPhoto(){

alert('Photo System Ready');

}

function addVideo(){

alert('Video System Ready');

}

function voiceInput(){

alert('Voice Input Ready');

}

function speakText(){

const speech =
new SpeechSynthesisUtterance(
data[currentWorkspace]
);

speechSynthesis.speak(speech);

}

function undoAction(){

alert('Undo Ready');

}

function redoAction(){

alert('Redo Ready');

}

updatePreview();

openWorkspace('A');

</script>

</body>
</html>
